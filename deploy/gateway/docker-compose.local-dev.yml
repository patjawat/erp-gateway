name: hospital-erp-gateway-dev

services:
  gateway:
    image: "${DEV_GATEWAY_IMAGE:?Run dev-gateway.sh}"
    pull_policy: never
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${DEV_GATEWAY_PORT:?Run dev-gateway.sh}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      GATEWAY_DATABASE_PATH: /data/gateway.db
      GATEWAY_CLIENT_TLS_CERT_FILE: /run/dev-gateway-tls/client-cert.pem
      GATEWAY_CLIENT_TLS_KEY_FILE: /run/dev-gateway-tls/client-key.pem
      GATEWAY_ENCRYPTION_KEY: "${DEV_GATEWAY_KEY:?Run dev-gateway.sh}"
      GATEWAY_ADMIN_USERNAME: dev-admin
      GATEWAY_ADMIN_PASSWORD: "${DEV_GATEWAY_PASSWORD:?Run dev-gateway.sh}"
      GATEWAY_COOKIE_SECURE: "false"
      GATEWAY_APPROVED_UPSTREAMS: ""
      GATEWAY_PRIVATE_UPSTREAM_CIDRS: ""
      GATEWAY_ALLOW_HTTP_UPSTREAM: "false"
      GATEWAY_TRUSTED_PROXY_CIDRS: ""
      GATEWAY_HOSPITAL_SERVER_CA_FILE: ""
      FCM_CREDENTIALS_FILE: ""
      DEV_GATEWAY_CERT_SHA256: "${DEV_GATEWAY_CERT_SHA256:?Run dev-gateway.sh}"
    volumes:
      - gateway-dev-data:/data
      - type: bind
        source: "${DEV_GATEWAY_STATE:?Run dev-gateway.sh}/tls"
        target: /run/dev-gateway-tls
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 12

volumes:
  gateway-dev-data:
